<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="말랑 捏捏铺 — 3D 半透明果冻捏捏，按、拉、两指捏、转着看，还能上传照片做成捏捏。">
<meta property="og:title" content="말랑 捏捏铺">
<meta property="og:description" content="3D 半透明果冻捏捏，按住捏、拖着拉、松手弹。">
</head>
<body>
<title>말랑 捏捏铺</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=ZCOOL+KuaiLe&display=swap">
<style>
/* Layout: one-screen toy. A dark photo-studio stage holds one real-3D squishy; its Korean name glows on the backdrop
   and gets refracted through the jelly. Flat controls sit on the floor line, a shelf of squishies runs along the bottom. */
:root{
  --bg:#0B0809; --fg:#F4EDE7; --muted:rgba(244,237,231,.56); --faint:rgba(244,237,231,.16); --shelf:#141013; --accent:#FF5A74;
  --f-display:'Jua','ZCOOL KuaiLe','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  --f-zh:'ZCOOL KuaiLe','Jua','PingFang SC','Microsoft YaHei',system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-zh);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
.app{height:100%;display:flex;flex-direction:column}

header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 20px 8px}
.logo{display:flex;align-items:baseline;gap:8px;white-space:nowrap}
.logo b{font-family:var(--f-display);font-weight:400;font-size:30px;line-height:1;color:var(--accent);transition:color .5s}
.logo span{font-size:15px;color:var(--muted)}
.meta{display:flex;align-items:center;gap:16px}
.count{display:flex;align-items:baseline;gap:5px;font-size:14px;color:var(--muted);white-space:nowrap}
.count b{font-family:var(--f-display);font-weight:400;font-size:26px;line-height:1;color:var(--fg);font-variant-numeric:tabular-nums;display:inline-block}
.count b.bump{animation:bump .32s cubic-bezier(.3,1.9,.5,1)}
@keyframes bump{0%{transform:scale(1)}45%{transform:scale(1.35) rotate(-6deg)}100%{transform:scale(1)}}
.snd{display:flex;align-items:center;gap:5px;background:none;border:0;padding:6px 2px;color:var(--fg);font:inherit;font-size:14px;cursor:pointer}
.snd svg{width:22px;height:22px}
.snd[aria-pressed="false"]{color:var(--muted)}

.stage{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:none;cursor:grab}
.stage.grabbing{cursor:grabbing}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block}
.tag{position:absolute;left:20px;top:6px;display:flex;align-items:baseline;gap:10px;pointer-events:none}
.tag .no{font-family:var(--f-display);font-size:13px;letter-spacing:.14em;color:var(--accent);transition:color .5s}
.tag .ko{font-family:var(--f-display);font-size:24px;line-height:1}
.tag .zh{font-size:14px;color:var(--muted)}
.hint{position:absolute;left:20px;top:40px;margin:0;max-width:min(330px,62%);font-size:13px;line-height:1.6;color:var(--muted);pointer-events:none;transition:opacity .8s}
.hint.dim{opacity:0}
.combo{position:absolute;right:22px;top:4px;display:flex;align-items:baseline;gap:6px;pointer-events:none;font-family:var(--f-display)}
.combo b{font-weight:400;font-size:44px;line-height:1;color:var(--accent);-webkit-text-stroke:6px var(--bg);paint-order:stroke fill}
.combo span{font-size:16px;color:var(--fg)}
.combo.hit b{animation:bump .3s cubic-bezier(.3,1.9,.5,1)}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-display);font-size:28px;color:var(--muted);pointer-events:none}
.toast{position:absolute;left:50%;top:44px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:6px;font-size:14px;white-space:nowrap;pointer-events:none}
.pop{position:absolute;font-family:var(--f-display);font-size:38px;line-height:1;color:var(--accent);-webkit-text-stroke:8px var(--bg);paint-order:stroke fill;
  pointer-events:none;white-space:nowrap;animation:pop .95s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes pop{
  0%{transform:translate(-50%,-50%) scale(.2) rotate(var(--r));opacity:0}
  18%{transform:translate(-50%,-90%) scale(1.18) rotate(var(--r));opacity:1}
  60%{transform:translate(-50%,-120%) scale(1) rotate(var(--r));opacity:1}
  100%{transform:translate(-50%,-160%) scale(.92) rotate(var(--r));opacity:0}}

.dock{position:absolute;left:20px;right:20px;bottom:14px;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;pointer-events:none}
.dock>*{pointer-events:auto}
.flavors{display:flex;flex-direction:column;gap:9px;min-width:0}
.flavors .lab{font-size:13px;color:var(--muted);white-space:nowrap}
.flavors .lab b{font-weight:400;color:var(--fg);margin-left:6px}
.sw{display:flex;gap:12px;flex-wrap:wrap}
.sw button{width:24px;height:24px;border-radius:50%;border:0;padding:0;background:var(--c);cursor:pointer;
  box-shadow:0 0 0 3px var(--bg),0 0 0 3px var(--faint);transition:box-shadow .2s,transform .3s cubic-bezier(.3,1.8,.5,1)}
.sw button:hover{transform:scale(1.12)}
.sw button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--fg);transform:scale(1.1)}
.glit{display:flex;align-items:center;gap:6px;background:none;border:0;color:var(--muted);font:inherit;font-size:14px;cursor:pointer;padding:6px 0;white-space:nowrap}
.glit svg{width:20px;height:20px}
.glit[aria-pressed="true"]{color:var(--fg)}
.glit[aria-pressed="true"] svg{color:var(--accent)}

.shelf{background:var(--shelf);padding-block:8px 10px}
.row{display:flex;gap:4px;overflow-x:auto;padding:0 16px;justify-content:safe center;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.item{flex:0 0 auto;width:76px;display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:0;padding:4px 0 6px;margin:0;
  color:var(--muted);font:inherit;font-size:13px;cursor:pointer;position:relative}
.item .pic{width:62px;height:62px;display:block;transition:transform .4s cubic-bezier(.3,1.9,.5,1)}
.item img.pic[src=""]{visibility:hidden}
.item:hover .pic{transform:translateY(-3px) scale(1.06)}
.item[aria-pressed="true"]{color:var(--fg)}
.item[aria-pressed="true"] .pic{transform:translateY(-5px) scale(1.14)}
.item[aria-pressed="true"]::after{content:"";position:absolute;bottom:0;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent)}
.item span{white-space:nowrap}
.item .box{box-sizing:border-box;width:50px;height:50px;margin:6px;border:2px dashed var(--muted);border-radius:16px;display:grid;place-items:center;color:var(--fg)}
.item .box svg{width:20px;height:20px}
.item:focus-visible,.snd:focus-visible,.glit:focus-visible,.sw button:focus-visible{outline:3px solid var(--fg);outline-offset:3px;border-radius:10px}
.sw button:focus-visible{border-radius:50%}

.drop{position:fixed;inset:0;display:grid;place-items:center;background:rgba(11,8,9,.9);color:var(--fg);font-family:var(--f-display);font-size:clamp(28px,7vw,56px);z-index:9;pointer-events:none}

@media (max-width:560px){
  header{padding:10px 16px 6px}
  .logo b{font-size:26px}.logo span{font-size:13px}
  .count b{font-size:22px}
  .snd span{display:none}
  .tag{left:16px}.hint{left:16px;max-width:70%;font-size:12px}
  .combo{right:16px}
  .dock{left:16px;right:16px;bottom:10px}
  .sw{gap:10px}
  .item{width:68px;font-size:12px}
  .item .pic{width:56px;height:56px}
}
@media (prefers-reduced-motion:reduce){
  .pop{animation-duration:.5s}
  .item .pic,.count b.bump,.combo.hit b{transition:none;animation:none}
}
</style>

<div class="app" id="app">
  <header>
    <div class="logo"><b>말랑</b><span>捏捏铺</span></div>
    <div class="meta">
      <div class="count">捏了<b id="count">0</b>下</div>
      <button class="snd" id="snd" type="button" aria-pressed="true" aria-label="音效开关">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z" fill="currentColor"/>
          <path id="sndWaves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11"/>
          <path id="sndOff" d="M16 9.5l5 5M21 9.5l-5 5" hidden/>
        </svg><span id="sndTxt">音效开</span>
      </button>
    </div>
  </header>

  <main class="stage" id="stage">
    <canvas id="gl" aria-label="可以捏的 3D 软糖"></canvas>
    <div class="loading" id="loading">말랑…</div>
    <div class="tag"><span class="no" id="tagNo">No.01</span><span class="ko" id="tagKo">곰젤리</span><span class="zh" id="tagZh">小熊软糖</span></div>
    <p class="hint" id="hint">按住捏，拖着拉，松手弹。两根手指一起捏更扁。在空白处左右拖能转它，点一下它会跳。</p>
    <div class="combo" id="combo" hidden><b id="comboN">×3</b><span>콤보</span></div>
    <div class="dock">
      <div class="flavors" id="flavors">
        <div class="lab">맛 · 口味<b id="flavName">딸기 草莓</b></div>
        <div class="sw" id="sw"></div>
      </div>
      <button class="glit" id="glit" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l1.9 5.6 5.6 1.9-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.9z"/><path d="M18.5 15l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/></svg>亮片
      </button>
    </div>
    <div class="toast" id="toast" hidden></div>
  </main>

  <nav class="shelf" aria-label="选一个捏捏">
    <div class="row" id="row"></div>
  </nav>
  <input type="file" id="file" accept="image/*" hidden>
  <div class="drop" id="drop" hidden>松手 · 做成照片捏捏</div>
</div>

<script>
setTimeout(() => { if (!window.__mallang) { const l = document.getElementById('loading'); if (l) l.textContent = '3D 没加载出来，刷新一下试试'; } }, 15000);
</script>

    });
    swEl.appendChild(b);
  });
  glitBtn.hidden = !it.def.glitter;
}
function select(i, drop = true) {
  if (active) { scene.remove(active.group); const P = active.geo.attributes.position; P.array.set(active.R); P.needsUpdate = true; active.geo.computeVertexNormals(); updateParts(active, 0); placeGlitter(active, false); }
  presses.clear(); orbit = null; stage.classList.remove('grabbing');
  sel = i; active = build(items[i]); scene.add(active.group);
  resetBody(); spin = 0; spinV = 0; faceV = 0;
  const R = active.R; for (let k = 0; k < NV; k++) KB[k] = .55 + .9 * (1 - clamp(R[3 * k + 1] / active.H, 0, 1));
  if (active.glit) active.glit.inst.visible = glitterOn;
  const n = items.indexOf(active) - items.filter(x => x.def.upload).length;
  $('tagNo').textContent = active.def.upload ? 'MY' : 'No.' + String(n + 1).padStart(2, '0');
  $('tagKo').textContent = active.def.ko; $('tagZh').textContent = active.def.zh;
  applyTheme(); renderFlavors();
  if (drop) { jumpY = 4.5; jumpV = 0; }
  row.querySelectorAll('.item[data-i]').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i)));
}
const thumbQ = [];
function queueThumb(it) { if (!thumbQ.includes(it)) thumbQ.push(it); }
const tctx = (() => { const c = document.createElement('canvas'); c.width = c.height = 124; return c.getContext('2d'); })();
function renderThumb(it) {
  build(it);
  const g = it.group, isActive = it === active, sy = g.position.y, sr = g.rotation.y;
  if (isActive) scene.remove(g);
  thumbScene.add(g); g.position.y = 0; g.rotation.y = -.35; g.updateMatrixWorld();
  thumbRim.color.set(flavorOf(it).c);
  const cw = cv.width, ch = cv.height, s = Math.min(cw, ch), size = Math.max(it.H, it.W) * 1.22;
  const dist = size * ch / (s * 2 * Math.tan(THREE.MathUtils.degToRad(15)));
  thumbCam.aspect = cw / ch; thumbCam.updateProjectionMatrix();
  thumbCam.position.set(0, it.H / 2 + Math.sin(.22) * dist, Math.cos(.22) * dist); thumbCam.lookAt(0, it.H / 2, 0);
  renderer.render(thumbScene, thumbCam);
  tctx.clearRect(0, 0, 124, 124); tctx.drawImage(cv, (cw - s) / 2, (ch - s) / 2, s, s, 0, 0, 124, 124);
  it.thumb = tctx.canvas.toDataURL();
  thumbScene.remove(g); g.position.y = sy; g.rotation.y = sr;
  if (isActive) scene.add(g);
  const img = row.querySelector(`.item[data-i="${items.indexOf(it)}"] img`); if (img) img.src = it.thumb;
}
function renderShelf() {
  row.textContent = '';
  const up = document.createElement('label'); up.className = 'item up'; up.htmlFor = 'file'; up.tabIndex = 0;
  up.innerHTML = '<span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span><span>上传图片</span>';
  up.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fileEl.click(); } });
  row.appendChild(up);
  items.forEach((it, i) => {
    const b = document.createElement('button'); b.type = 'button'; b.className = 'item'; b.dataset.i = i; b.setAttribute('aria-pressed', String(i === sel));
    const im = document.createElement('img'); im.className = 'pic'; im.alt = ''; im.draggable = false; im.setAttribute('src', it.thumb || '');
    const sp = document.createElement('span'); sp.textContent = it.def.zh;
    b.append(im, sp);
    b.addEventListener('click', () => { ensureAudio(); sfx.pick(); select(i); });
    row.appendChild(b);
    if (!it.thumb) queueThumb(it);
  });
}

/* ---------- uploads ---------- */
const MAX_UP = 4;
function saveUploads() {
  let list = items.filter(it => it.def.upload).map(it => it.saved);
  while (list.length && !store.set('mallang3d-uploads', list)) list.pop();
}
function toast(msg) { toastEl.textContent = msg; toastEl.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.hidden = true, 2600); }
async function loadImg(src) { const img = new Image(); img.src = src; await img.decode(); return img; }
function shrink(c) { const k = Math.min(1, 640 / Math.max(c.width, c.height)), s = document.createElement('canvas'); s.width = Math.round(c.width * k); s.height = Math.round(c.height * k); s.getContext('2d').drawImage(c, 0, 0, s.width, s.height); return s.toDataURL('image/jpeg', .86); }
async function addImage(file) {
  if (!file || !/^image\//.test(file.type)) { toast('只能放图片哦，JPG / PNG 都行'); return; }
  const url = URL.createObjectURL(file);
  try {
    const m = processImage(await loadImg(url)), n = items.filter(x => x.def.upload).length;
    const it = { def: uploadDef(m, '我的捏捏' + (n + 1)), fi: 0, saved: { src: shrink(m.c), zh: '我的捏捏' + (n + 1) } };
    const cur = active; items.unshift(it);
    const ups = items.filter(x => x.def.upload); if (ups.length > MAX_UP) items.splice(items.indexOf(ups[ups.length - 1]), 1);
    sel = items.indexOf(cur); saveUploads(); renderShelf(); ensureAudio(); select(0);
    row.scrollTo({ left: 0, behavior: 'smooth' }); toast('做好了，捏它！');
  } catch (e) { toast('这张图读不了，换 JPG / PNG 试试'); }
  finally { URL.revokeObjectURL(url); }
}
fileEl.addEventListener('change', () => { addImage(fileEl.files[0]); fileEl.value = ''; });
let dragDepth = 0; const hasFiles = e => e.dataTransfer && [...e.dataTransfer.types].includes('Files');
addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; dropEl.hidden = false; });
addEventListener('dragover', e => { if (hasFiles(e)) e.preventDefault(); });
addEventListener('dragleave', e => { if (!hasFiles(e)) return; if (--dragDepth <= 0) { dragDepth = 0; dropEl.hidden = true; } });
addEventListener('drop', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth = 0; dropEl.hidden = true; addImage(e.dataTransfer.files[0]); });
addEventListener('paste', e => { const f = [...(e.clipboardData?.files || [])].find(f => /^image\//.test(f.type)); if (f) addImage(f); });

const sndBtn = $('snd');
function paintSound() { sndBtn.setAttribute('aria-pressed', String(soundOn)); $('sndTxt').textContent = soundOn ? '音效开' : '音效关'; $('sndWaves').toggleAttribute('hidden', !soundOn); $('sndOff').toggleAttribute('hidden', soundOn); }
sndBtn.addEventListener('click', () => { soundOn = !soundOn; store.set('mallang-sound', soundOn); ensureAudio(); paintSound(); sfx.pick(); });
paintSound();
function paintGlit() { glitBtn.setAttribute('aria-pressed', String(glitterOn)); }
glitBtn.addEventListener('click', () => {
  glitterOn = !glitterOn; store.set('mallang3d-glitter', glitterOn); paintGlit(); ensureAudio(); sfx.pick();
  items.forEach(it => { if (it.glit) { it.glit.inst.visible = glitterOn; if (it.built) queueThumb(it); } });
});
paintGlit();

/* ---------- boot ---------- */
function layout() {
  W = Math.max(1, stage.clientWidth); H = Math.max(1, stage.clientHeight);
  renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); paintBackdrop();
}
renderShelf();
new ResizeObserver(layout).observe(stage);
layout();
select(0);
document.fonts && document.fonts.load('100px Jua').then(paintBackdrop).catch(() => {});
(async () => {
  const saved = store.get('mallang3d-uploads', []), add = [];
  for (const s of saved) { try { const m = processImage(await loadImg(s.src)); add.push({ def: uploadDef(m, s.zh), fi: 0, saved: s }); } catch (e) {} }
  if (add.length) { const cur = active; items.unshift(...add); sel = items.indexOf(cur); renderShelf(); select(sel, false); }
})();
window.__mallang = true; $('loading').remove();
requestAnimationFrame(t => { last = t; frame(t); });
</script>

</body>
